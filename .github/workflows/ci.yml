name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Security ────────────────────────────────────────────────────────────
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # ── Lint ────────────────────────────────────────────────────────────────
      # continue-on-error: true totdat alle lint issues gefixed zijn
      - name: Lint (ESLint)
        run: npm run lint

      # ── Tests + coverage ────────────────────────────────────────────────────
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
